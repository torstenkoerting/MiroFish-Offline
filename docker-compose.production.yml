services:
  mirofish:
    build: .
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  neo4j:
    image: neo4j:5.18-community
    expose:
      - "7687"
      - "7474"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Embeddings only. The chat model runs on Ollama Cloud, which has no
  # /v1/embeddings endpoint - so nomic-embed-text has to live here.
  # After the first deploy:  ollama pull nomic-embed-text  (~274 MB)
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  uploads:
